services:
  postgres:
    image: postgres:16-alpine
    container_name: nexxnotify-postgres
    environment:
      POSTGRES_USER: nexxnotify
      POSTGRES_PASSWORD: nexxnotify
      POSTGRES_DB: nexxnotify
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexxnotify -d nexxnotify"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: nexxnotify-api
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgres://nexxnotify:nexxnotify@postgres:5432/nexxnotify?sslmode=disable
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
